name: Codex Usage Meter Windows
on:
  push:
    paths:
      - "tools/codex-usage-meter/**"
      - ".github/workflows/codex-usage-meter-windows.yml"
  pull_request:
    paths:
      - "tools/codex-usage-meter/**"
      - ".github/workflows/codex-usage-meter-windows.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
        working-directory: tools/codex-usage-meter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/read-usage.test.mjs
      - run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File ./CodexMeter.ps1 -SelfTest
