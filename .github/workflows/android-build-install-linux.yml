name: Android Build Install Linux

on:
  push:
    paths:
      - "tools/android-build-install-linux/**"
      - ".github/workflows/android-build-install-linux.yml"
  pull_request:
    paths:
      - "tools/android-build-install-linux/**"
      - ".github/workflows/android-build-install-linux.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/android-build-install-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
